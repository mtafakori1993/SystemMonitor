[package]
name = "SystemMonitor"
version = "1.0.2"
edition = "2024"

[dependencies]
eframe = { optional = true, version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_extras = { optional = true, version = "0.37", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "time"] }
zbus = { version = "6.2", default-features = false, features = ["tokio", "proxy"] }

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
